name: Evidence Engine browser validation

on:
  push:
    branches: [mission-029-evidence-engine-local-date]
    paths:
      - 'evidence-engine.html'
      - 'tests/evidence-engine-local-date.test.cjs'
      - 'tests/evidence-engine.browser.cjs'
      - '.github/workflows/evidence-engine-browser-validation.yml'
  pull_request:
    paths:
      - 'evidence-engine.html'
      - 'tests/evidence-engine-local-date.test.cjs'
      - 'tests/evidence-engine.browser.cjs'
      - '.github/workflows/evidence-engine-browser-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic DOM date regressions
        run: node --test tests/evidence-engine-local-date.test.cjs
      - name: Install temporary Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise Evidence Engine in Chromium
        run: node tests/evidence-engine.browser.cjs
