name: KI-02 baseline regression
on:
  push:
    paths:
      - 'ki02/**'
      - 'scout/**'
      - '.github/workflows/ki02-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run KI-02 synthetic baseline tests
        run: python -m unittest discover -s ki02/tests -v
      - name: Run actual SCOUT baseline
        run: python -m ki02.scout_baseline
